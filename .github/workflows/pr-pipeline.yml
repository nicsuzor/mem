name: "PR Review Pipeline"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches:
      - feature/mem-api-modernise

jobs:
  # ─── Step 1: Rust CI ──────────────────────────────────────────────
  # This project uses Rust, so we run cargo checks here.
  check:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no tracked files are gitignored
        run: |
          ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            echo "These files are tracked but gitignored (breaks release-plz):"
            echo "$ignored"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo test
      - name: Inventory Lint
        run: ./scripts/inventory.py --lint
      - run: cargo build --release
