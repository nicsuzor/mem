name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. mem-v0.4.0 or v0.4.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump Cargo.toml + Cargo.lock to ${{ inputs.tag }}
        id: set-tag
        run: |
          set -euo pipefail
          RAW_TAG="${{ inputs.tag }}"
          VERSION="${RAW_TAG#mem-}"
          VERSION="${VERSION#v}"
          # Bump first version line (the [package] version)
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          # Bump the mem entry in Cargo.lock
          python3 - "$VERSION" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("Cargo.lock")
          t = p.read_text()
          t2 = re.sub(r'(name = "mem"\nversion = ")[^"]*', lambda m: m.group(1) + v, t)
          if t == t2:
              sys.exit("Cargo.lock: mem entry not found")
          p.write_text(t2)
          PY
          git add Cargo.toml Cargo.lock
          TAG="${RAW_TAG}"
          if [[ ! "$TAG" =~ ^mem- ]]; then
            TAG="mem-$TAG"
          fi
          git commit -m "chore: release $TAG"
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    needs: bump-and-tag
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.bump-and-tag.outputs.tag }}
      prerelease: ${{ inputs.prerelease }}
