name: Build & Publish Extension

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Bump extension version
        run: |
          REV_COUNT=$(git rev-list --count HEAD)
          BASE_PREFIX=$(node -p "require('./editors/vscode/package.json').version.split('.').slice(0, 2).join('.')")
          TARGET_VERSION="${BASE_PREFIX}.${REV_COUNT}"
          echo "Bumping extension version to ${TARGET_VERSION}"
          node ./editors/vscode/scripts/bump-version.js "${TARGET_VERSION}"

      - name: Compile TypeScript
        working-directory: editors/vscode
        run: npm run compile

      - name: Package extension
        working-directory: editors/vscode
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: mem-vscode
          path: editors/vscode/*.vsix

      - name: Update GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            echo "Attaching extension VSIX to latest release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" editors/vscode/*.vsix --clobber
          else
            echo "No existing GitHub release found; VSIX is stored in workflow artifacts."
          fi
